name: ShopSphere CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Auth Service
        run: |
          cd auth-service
          mvn clean test-compile

      - name: Build Core Service
        run: |
          cd core-service
          mvn -B clean test

      - name: Verify Docker Compose Build
        run: docker compose build

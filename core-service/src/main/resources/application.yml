server:
  port: 8082

spring:
  application:
    name: core-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:shopsphere_core}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

security:
  jwt:
    # MUST match auth-service's secret -- this is how core-service trusts tokens
    # it never issued itself. Supply via env var / secret manager in production.
    secret: ${JWT_SECRET:change-this-super-secret-key-min-256-bits-for-hs256-signing}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.shopsphere.core: INFO
